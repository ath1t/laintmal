<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terminal Dice</title>
    
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.152.2/examples/jsm/"
            }
        }
    </script>

    <style>
        :root {
            --term-green: #00ff00;
            --term-dark-green: #003300;
            --term-bg: #050505;
            --glow: 0 0 10px var(--term-green);
        }

        body { 
            margin: 0; 
            background-color: var(--term-bg);
            color: var(--term-green); 
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden; 
            user-select: none;
            text-transform: uppercase;
        }

        /* CRT Scanline Effect */
        body::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 20;
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
            filter: contrast(1.2) brightness(1.1) drop-shadow(0 0 5px var(--term-green));
        }

        /* The Unstable CRT Flicker Animation */
        @keyframes crt-flicker {
            0%   { opacity: 1; text-shadow: var(--glow); }
            5%   { opacity: 0.8; text-shadow: none; }
            10%  { opacity: 1; text-shadow: var(--glow); }
            15%  { opacity: 1; text-shadow: var(--glow); }
            50%  { opacity: 0.95; text-shadow: var(--glow); }
            51%  { opacity: 0.4; text-shadow: none; }
            53%  { opacity: 0.95; text-shadow: var(--glow); }
            75%  { opacity: 1; text-shadow: var(--glow); }
            76%  { opacity: 0.6; text-shadow: none; }
            77%  { opacity: 1; text-shadow: var(--glow); }
            100% { opacity: 1; text-shadow: var(--glow); }
        }

        .ui-layer {
            position: absolute;
            inset: 0;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between; 
            padding: 20px; 
            /* Apply the flicker to the whole UI */
            animation: crt-flicker 6s infinite;
        }

        .terminal-header {
            text-shadow: var(--glow);
        }

        .terminal-header p { margin: 2px 0; }
        
        .output-block {
            margin-top: 20px;
            border-left: 2px solid var(--term-green);
            padding-left: 10px;
        }

        .score-value {
            font-size: 48px;
            font-weight: bold;
            line-height: 1;
            margin: 10px 0;
        }

        .cursor {
            display: inline-block;
            width: 12px;
            height: 24px;
            background-color: var(--term-green);
            vertical-align: bottom;
            animation: blink 1s step-end infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        .terminal-footer {
            pointer-events: auto;
            margin-bottom: 20px;
        }

        .prompt-line {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 18px;
            text-shadow: var(--glow);
        }

        .roll-btn { 
            background: transparent;
            border: 1px solid var(--term-green);
            color: var(--term-green);
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            font-size: 18px;
            padding: 8px 16px;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 0 5px rgba(0, 255, 0, 0.2) inset, 0 0 5px rgba(0, 255, 0, 0.2);
            transition: all 0.1s;
        }

        .roll-btn:hover {
            background: var(--term-green);
            color: var(--term-bg);
            box-shadow: var(--glow);
        }

        .roll-btn:active { 
            transform: translateY(2px);
        }

    </style>
</head>
<body>
    <div class="ui-layer">
        
        <div class="terminal-header">
            <p>NEO_OS v9.4.1 (tty1)</p>
            <p>SYSTEM INITIALIZED...</p>
            <p>PHYSICS ENGINE: CANNON-ES ONLINE</p>
            
            <div class="output-block">
                <p>> SYS_OUT: TOTAL_ROLL_VALUE</p>
                <div class="score-value" id="total">[ WAIT ]</div>
            </div>
        </div>

        <div class="terminal-footer">
            <div class="prompt-line">
                <span>root@neo-dice:~#</span>
                <button class="roll-btn" id="rollBtn">./roll_dice.sh</button>
                <span class="cursor"></span>
            </div>
        </div>

    </div>

    <script type="module">
        import * as THREE from 'three';
        import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
        import * as CANNON from 'https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js';

        // 1. Initialize Scene
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x050505, 0.015); 
        
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 10, 18);
        camera.lookAt(0, -1, 0); 
        
        const renderer = new THREE.WebGLRenderer({ antialias: false, alpha: true }); 
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); 
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setClearColor(0x050505, 1); 
        renderer.outputColorSpace = THREE.SRGBColorSpace; 
        
        document.body.appendChild(renderer.domElement);

        // 2. Initialize Physics World
        const world = new CANNON.World({ gravity: new CANNON.Vec3(0, -9.82, 0) });
        world.allowSleep = true; 
        
        const diceContactMaterial = new CANNON.Material();
        world.addContactMaterial(new CANNON.ContactMaterial(diceContactMaterial, diceContactMaterial, { 
            friction: 0.3, 
            restitution: 0.4 
        }));

        // 3. Lighting (Harsh, overhead + slight ambient)
        const ambientLight = new THREE.AmbientLight(0x003300, 2.5); 
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0x00ff00, 1.5);
        dirLight.position.set(10, 20, 10);
        scene.add(dirLight);

        // 4. Arena Boundaries
        const createWall = (x, y, z, rotX, rotY, rotZ) => {
            const body = new CANNON.Body({ mass: 0, shape: new CANNON.Plane(), material: diceContactMaterial });
            body.position.set(x, y, z);
            body.quaternion.setFromEuler(rotX, rotY, rotZ);
            world.addBody(body);
        };
        createWall(0, 0, 0, -Math.PI/2, 0, 0); 
        createWall(0, 0, -7, 0, 0, 0);
        createWall(0, 0, 7, 0, Math.PI, 0);
        createWall(-7, 0, 0, 0, Math.PI/2, 0);
        createWall(7, 0, 0, 0, -Math.PI/2, 0);

        // TERMINAL GRID FLOOR
        const gridHelper = new THREE.GridHelper(60, 60, 0x00ff00, 0x003300);
        gridHelper.position.y = 0.01; 
        scene.add(gridHelper);

        // 5. Terminal Texture Generator 
        function getTexture(num) {
            const canvas = document.createElement('canvas');
            canvas.width = 256; canvas.height = 256;
            const ctx = canvas.getContext('2d');
            
            // Black dice body
            ctx.fillStyle = '#050505'; 
            ctx.fillRect(0, 0, 256, 256);
            
            // Green neon border
            ctx.lineWidth = 12;
            ctx.strokeStyle = '#00ff00';
            ctx.strokeRect(6, 6, 244, 244);

            // Green neon pips
            ctx.fillStyle = '#00ff00'; 
            const p = { 
                1: [[128,128]], 
                2: [[64,64],[192,192]], 
                3: [[64,64],[128,128],[192,192]], 
                4: [[64,64],[64,192],[192,64],[192,192]], 
                5: [[64,64],[64,192],[128,128],[192,64],[192,192]], 
                6: [[64,50],[64,128],[64,206],[192,50],[192,128],[192,206]] 
            };
            p[num]?.forEach(coord => { 
                ctx.beginPath(); 
                ctx.arc(coord[0], coord[1], 20, 0, Math.PI*2); 
                ctx.fill(); 
            });
            
            const texture = new THREE.CanvasTexture(canvas);
            texture.colorSpace = THREE.SRGBColorSpace; 
            return texture;
        }

        // Apply emissive map so the numbers glow even in the dark!
        const visualFaces = [3, 4, 1, 6, 2, 5]; 
        const diceMats = visualFaces.map(n => {
            const tex = getTexture(n);
            return new THREE.MeshStandardMaterial({
                map: tex,
                emissiveMap: tex,
                emissive: new THREE.Color(0xffffff),
                emissiveIntensity: 0.9, 
                roughness: 0.8,
                metalness: 0.2
            });
        });

        const roundedGeometry = new RoundedBoxGeometry(2, 2, 2, 4, 0.15); 
        
        const createDice = (x) => {
            const mesh = new THREE.Mesh(roundedGeometry, diceMats);
            scene.add(mesh);

            const body = new CANNON.Body({
                mass: 1,
                shape: new CANNON.Box(new CANNON.Vec3(1, 1, 1)),
                material: diceContactMaterial,
                allowSleep: true,
                sleepSpeedLimit: 0.1,
                sleepTimeLimit: 0.5
            });
            
            body.angularDamping = 0.32;
            body.linearDamping = 0.08;
            body.position.set(x, 6, 0);
            world.addBody(body);
            
            return { mesh, body };
        };
        
        const d1 = createDice(-2.6);
        const d2 = createDice(2.6);

        // 6. Value Check logic 
        const getVal = (body) => {
            const up = new THREE.Vector3(0, 1, 0);
            const faces = [
                {v:3, n:[1,0,0]}, {v:4, n:[-1,0,0]}, {v:1, n:[0,1,0]}, 
                {v:6, n:[0,-1,0]}, {v:2, n:[0,0,1]}, {v:5, n:[0,0,-1]}
            ];
            
            let best = 1, max = -1;
            faces.forEach(f => {
                const vec = new THREE.Vector3(...f.n).applyQuaternion(body.quaternion);
                const dot = vec.dot(up);
                if(dot > max) { max = dot; best = f.v; }
            });
            return best;
        };

        // 7. Roll Interaction
        const totalUI = document.getElementById('total');
        document.getElementById('rollBtn').onclick = () => {
            totalUI.innerText = "[ EXECUTING... ]";

            [d1, d2].forEach((d, i) => {
                d.body.wakeUp();
                
                d.body.position.set(i === 0 ? -2.6 : 2.6, 6, 0);
                d.body.quaternion.set(0, 0, 0, 1);
                d.body.velocity.set(0, 0, 0);
                d.body.angularVelocity.set(0, 0, 0);
                
                d.body.applyImpulse(
                    new CANNON.Vec3(
                        (Math.random()-0.5)*2.2,
                        5,
                        (Math.random()-0.5)*2.2
                    ),
                    new CANNON.Vec3(0, 0, 0)
                );
                d.body.angularVelocity.set(
                    Math.random()*6,
                    Math.random()*6,
                    Math.random()*6
                );
            });
        };

        // 8. Loop
        function animate() {
            requestAnimationFrame(animate);

            // Rotate grid slightly to feel dynamic
            const time = performance.now() * 0.0003;
            camera.position.x = Math.sin(time * 0.2) * 2;
            camera.position.z = 18 + Math.cos(time * 0.2) * 2;
            camera.lookAt(0, -1, 0);

            world.step(1/60);

            [d1, d2].forEach(d => {
                d.mesh.position.copy(d.body.position);
                d.mesh.quaternion.copy(d.body.quaternion);
            });

            if (
                d1.body.sleepState === 2 &&
                d2.body.sleepState === 2 &&
                totalUI.innerText === "[ EXECUTING... ]"
            ) {
                const result = getVal(d1.body) + getVal(d2.body);
                totalUI.innerText = `[ ${result} ]`;
            }

            renderer.render(scene, camera);
        }
        animate();

        // 9. Handle Window Resizing
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
